[project]
name = "puente-mcp-civil3d"
version = "1.3.1"
description = "Puente MCP para Civil 3D 2027 (plugin ArbaMcp)"
readme = "INSTRUCCIONES_AGENTE.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "httpx",
    "uvicorn",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
